name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\AIVideoBatchStudio\AIVideoBatchStudio.csproj

      - name: Publish single Windows EXE
        shell: pwsh
        run: |
          dotnet publish .\src\AIVideoBatchStudio\AIVideoBatchStudio.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o .\release
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          if (-not (Test-Path .\release\AIVideoBatchStudio.exe)) { throw 'AIVideoBatchStudio.exe was not produced.' }

      - name: Smoke test PE header
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('.\release\AIVideoBatchStudio.exe')
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Output is not a valid Windows PE executable.' }
          Write-Host "EXE size: $($bytes.Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoBatchStudio-EXE
          path: .\release\AIVideoBatchStudio.exe
          if-no-files-found: error
